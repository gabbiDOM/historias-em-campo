  <path d="M250 60l-70 36 24 62 34-16v170h164V142l34 16 24-62-70-36c-8 22-32 36-60 36s-52-14-60-36z" fill="none" stroke="#0b1f3a" stroke-width="5" stroke-linejoin="round"/>
