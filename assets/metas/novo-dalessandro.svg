  <text x="560" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="#fff" letter-spacing="1">15–23</text>
  <text x="560" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fff" opacity=".8" letter-spacing="2">ANOS</text>
