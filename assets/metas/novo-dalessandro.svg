<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1a33"/><stop offset=".6" stop-color="#16406f"/><stop offset="1" stop-color="#3f7fbd"/></linearGradient>
    <pattern id="listras" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)"><rect width="28" height="56" fill="#9cc7ee"/></pattern>
    <radialGradient id="radar" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9cc7ee" stop-opacity=".25"/><stop offset="1" stop-color="#9cc7ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="varredura" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9cc7ee" stop-opacity="0"/><stop offset="1" stop-color="#9cc7ee" stop-opacity=".35"/></linearGradient>
    <clipPath id="camisa"><path d="M282 96l-56 28 18 50 26-12v124h100V162l26 12 18-50-56-28c-6 16-24 26-38 26s-32-10-38-26z"/></clipPath>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#listras)" opacity=".07"/>
  <!-- radar do scout -->
  <g transform="translate(320 190)">
    <circle r="165" fill="url(#radar)"/>
    <g fill="none" stroke="#cfe4f7" stroke-opacity=".16" stroke-width="1.5"><circle r="70"/><circle r="115"/><circle r="160"/></g>
    <path d="M-170 0h340M0-170v340" stroke="#cfe4f7" stroke-opacity=".1"/>
    <path d="M0 0L160 -40A165 165 0 0 1 140 88z" fill="url(#varredura)"/>
    <circle cx="128" cy="-22" r="5" fill="#f6c343"/><circle cx="128" cy="-22" r="12" fill="none" stroke="#f6c343" stroke-opacity=".5"/>
  </g>
  <!-- sol de maio -->
  <g transform="translate(78 70)" opacity=".9">
    <circle r="15" fill="#f6c343"/>
    <g stroke="#f6c343" stroke-width="3" stroke-linecap="round"><path d="M0-22v-10M0 22v10M-22 0h-10M22 0h10M16-16l7-7M-16 16l-7 7M16 16l7 7M-16-16l-7-7"/></g>
  </g>
  <!-- curva do chute de pé esquerdo -->
  <path d="M70 300C150 210 220 180 300 175" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <g transform="translate(70 300)"><circle r="14" fill="#fff"/><path d="M0-8l7 5-3 8h-8l-3-8z" fill="#0a1a33"/></g>
  <!-- camisa albiceleste com o 10 -->
  <g filter="url(#sombra)">
    <g clip-path="url(#camisa)">
      <rect x="220" y="90" width="200" height="200" fill="#f4f8fc"/>
      <g fill="#74acdf"><rect x="262" y="90" width="22" height="200"/><rect x="306" y="90" width="22" height="200"/><rect x="350" y="90" width="22" height="200"/><rect x="394" y="90" width="22" height="200"/></g>
    </g>
    <path d="M282 96l-56 28 18 50 26-12v124h100V162l26 12 18-50-56-28c-6 16-24 26-38 26s-32-10-38-26z" fill="none" stroke="#0a1a33" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
  <text x="320" y="238" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="66" fill="#0a1a33">10</text>
  <!-- o próximo craque ainda é uma incógnita -->
  <g transform="translate(408 112)"><circle r="22" fill="#f6c343"/><text y="9" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="26" fill="#0a1a33">?</text></g>
  <!-- etiquetas do perfil -->
  <g font-family="Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="1.5">
    <rect x="404" y="306" width="60" height="28" rx="14" fill="#0a1a33" fill-opacity=".7" stroke="#9cc7ee" stroke-opacity=".6"/><text x="434" y="325" text-anchor="middle" fill="#fff">MEI</text>
    <rect x="472" y="306" width="96" height="28" rx="14" fill="#0a1a33" fill-opacity=".7" stroke="#9cc7ee" stroke-opacity=".6"/><text x="520" y="325" text-anchor="middle" fill="#fff">CANHOTO</text>
    <rect x="474" y="270" width="94" height="28" rx="14" fill="#f6c343"/><text x="521" y="289" text-anchor="middle" fill="#0a1a33">15–23 ANOS</text>
  </g>
</svg>
