<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <pattern id="listras" width="60" height="360" patternUnits="userSpaceOnUse"><rect width="30" height="360" fill="#74acdf"/><rect x="30" width="30" height="360" fill="#f4f8fc"/></pattern>
    <linearGradient id="sombra" x1="0" y1="0" x2="0" y2="1"><stop offset=".35" stop-color="#0b1f3a" stop-opacity="0"/><stop offset="1" stop-color="#0b1f3a" stop-opacity=".75"/></linearGradient>
    <clipPath id="camisa"><path d="M250 60l-70 36 24 62 34-16v170h164V142l34 16 24-62-70-36c-8 22-32 36-60 36s-52-14-60-36z"/></clipPath>
  </defs>
