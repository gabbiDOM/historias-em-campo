<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- Permanecer na Bundesliga: tabela com a zona de rebaixamento abaixo e a âncora segurando o clube na parte de cima -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173f26"/><stop offset="1" stop-color="#08170e"/></linearGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe9a6"/><stop offset=".5" stop-color="#e2b84c"/><stop offset="1" stop-color="#a87a22"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- tabela: 18 linhas -->
  <g transform="translate(64 26)">
    <g fill="#fff" opacity=".09">
      <rect y="0" width="300" height="13" rx="3"/><rect y="17" width="300" height="13" rx="3"/><rect y="34" width="300" height="13" rx="3"/><rect y="51" width="300" height="13" rx="3"/>
      <rect y="68" width="300" height="13" rx="3"/><rect y="85" width="300" height="13" rx="3"/><rect y="102" width="300" height="13" rx="3"/>
      <rect y="136" width="300" height="13" rx="3"/><rect y="153" width="300" height="13" rx="3"/><rect y="170" width="300" height="13" rx="3"/><rect y="187" width="300" height="13" rx="3"/>
      <rect y="204" width="300" height="13" rx="3"/><rect y="221" width="300" height="13" rx="3"/><rect y="238" width="300" height="13" rx="3"/><rect y="255" width="300" height="13" rx="3"/>
    </g>
    <!-- o clube, firme no meio da tabela -->
    <rect y="119" width="300" height="13" rx="3" fill="#8ee53f"/>
    <circle cx="-14" cy="125.5" r="9" fill="#8ee53f"/><text x="-14" y="130" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="11" font-weight="900" fill="#0b1d12">W</text>
    <!-- zona de rebaixamento -->
    <path d="M-6 279h312" stroke="#e5333a" stroke-width="3" stroke-dasharray="8 6"/>
    <g fill="#e5333a" opacity=".55"><rect y="285" width="300" height="13" rx="3"/><rect y="302" width="300" height="13" rx="3"/></g>
  </g>
  <!-- âncora: temporada de consolidação -->
  <g transform="translate(490 150)" fill="none" stroke="url(#ouro)" stroke-linecap="round" stroke-linejoin="round">
    <circle cy="-78" r="18" stroke-width="12"/>
    <path d="M0-60v170M-46-30h92" stroke-width="14"/>
    <path d="M-86 60a90 90 0 0 0 172 0" stroke-width="14"/>
    <path d="M-100 52l14 8 8-16M100 52l-14 8-8-16" stroke-width="12"/>
  </g>
  <text x="490" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="4" fill="#8ee53f">BUNDESLIGA</text>
</svg>
