<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- Chegar às quartas da DFB-Pokal: chave do mata-mata com a fase das quartas em destaque -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#211a0a"/><stop offset="1" stop-color="#0a0806"/></linearGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe9a6"/><stop offset="1" stop-color="#b8892b"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <g stroke="#d4af37" stroke-opacity=".07"><path d="M-20 360L340 0M60 360L420 0M140 360L500 0M220 360L580 0M300 360L660 0"/></g>
  <!-- faixa da fase-alvo (quartas), dos dois lados -->
  <g fill="#8ee53f" opacity=".1"><rect x="112" y="40" width="76" height="290" rx="10"/><rect x="452" y="40" width="76" height="290" rx="10"/></g>
  <!-- oitavas (4 por lado) -> quartas (2) -> semi (1) -->
  <g fill="none" stroke="#d4af37" stroke-opacity=".55" stroke-width="3" stroke-linecap="round">
    <path d="M30 80h56M30 130h56M86 80v50M86 105h40"/><path d="M30 240h56M30 290h56M86 240v50M86 265h40"/>
    <path d="M610 80h-56M610 130h-56M554 80v50M554 105h-40"/><path d="M610 240h-56M610 290h-56M554 240v50M554 265h-40"/>
    <path d="M174 105h40v160h-40M214 185h40"/><path d="M466 105h-40v160h40M426 185h-40"/>
  </g>
  <!-- vagas das quartas -->
  <g fill="#0b1d12" stroke="#8ee53f" stroke-width="3">
    <rect x="126" y="92" width="48" height="26" rx="6"/><rect x="126" y="252" width="48" height="26" rx="6"/>
    <rect x="466" y="92" width="48" height="26" rx="6"/><rect x="466" y="252" width="48" height="26" rx="6"/>
  </g>
  <!-- o Wolfsburg numa das vagas -->
  <rect x="126" y="92" width="48" height="26" rx="6" fill="#8ee53f"/>
  <text x="150" y="110" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="15" fill="#0b1d12">W</text>
  <g font-family="Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="2" fill="#8ee53f" text-anchor="middle">
    <text x="150" y="62">QUARTAS</text><text x="490" y="62">QUARTAS</text>
  </g>
  <!-- taça no centro -->
  <g fill="url(#ouro)">
    <path d="M288 140h64v26a32 32 0 0 1-64 0z"/>
    <path d="M288 148h-14a14 14 0 0 0 14 22v-8a6 6 0 0 1-6-6h6z"/><path d="M352 148h14a14 14 0 0 1-14 22v-8a6 6 0 0 0 6-6h-6z"/>
    <rect x="313" y="196" width="14" height="20" rx="3"/><rect x="298" y="214" width="44" height="10" rx="3"/><rect x="290" y="224" width="60" height="14" rx="4"/>
  </g>
  <text x="320" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="3" fill="#e8c766" opacity=".85">DFB-POKAL</text>
</svg>
