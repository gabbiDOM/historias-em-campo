<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- Regra da janela: só metade do que entrou com vendas pode sair em contratações -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173a24"/><stop offset="1" stop-color="#0a1a10"/></linearGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbe9a6"/><stop offset=".5" stop-color="#e2b84c"/><stop offset="1" stop-color="#a87a22"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- moeda dividida: metade verde (pode gastar), metade tracejada (fica no caixa) -->
  <g transform="translate(200 180)">
    <path d="M0-120a120 120 0 0 0 0 240z" fill="url(#ouro)"/>
    <path d="M0-120a120 120 0 0 1 0 240" fill="none" stroke="#e2b84c" stroke-width="5" stroke-dasharray="10 9" opacity=".7"/>
    <path d="M0-132v264" stroke="#fff" stroke-width="4" stroke-opacity=".6"/>
    <text x="-58" y="28" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="84" fill="#5a3f0c">€</text>
    <text x="58" y="24" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="58" fill="#e2b84c" opacity=".35">€</text>
  </g>
  <text x="372" y="168" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="96" fill="#fff">50%</text>
  <g font-family="Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="2">
    <rect x="376" y="204" width="14" height="14" rx="3" fill="#e2b84c"/><text x="398" y="216" fill="#fff">PARA CONTRATAR</text>
    <rect x="376" y="232" width="14" height="14" rx="3" fill="none" stroke="#e2b84c" stroke-width="2" stroke-dasharray="4 3"/><text x="398" y="244" fill="#fff" opacity=".7">FICA NO CAIXA</text>
  </g>
  <text x="376" y="300" font-family="Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="3" fill="#8ee53f">DO VALOR DAS VENDAS</text>
</svg>
