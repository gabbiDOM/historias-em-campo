<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- Scouting: no mínimo 5 argentinos no elenco. Faixas celeste e branca, sol e cinco camisas -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10324a"/><stop offset="1" stop-color="#06121c"/></linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <g opacity=".14"><rect y="0" width="640" height="120" fill="#74acdf"/><rect y="240" width="640" height="120" fill="#74acdf"/></g>
  <!-- sol de maio -->
  <g transform="translate(520 92)" fill="#f6c343">
    <circle r="26"/>
    <g stroke="#f6c343" stroke-width="5" stroke-linecap="round">
      <path d="M0-36v-16M0 36v16M-36 0h-16M36 0h16M25-25l11-11M-25 25l-11 11M25 25l11 11M-25-25l-11-11"/>
    </g>
  </g>
  <!-- cinco camisas listradas -->
  <defs>
    <g id="camisa">
      <path d="M-26-30l14-8h24l14 8 16 18-12 12-8-6v46h-44v-46l-8 6-12-12z" fill="#fff"/>
      <path d="M-14-38h8v84h-8zM6-38h8v84h-8z" fill="#74acdf"/>
      <path d="M-8-38a8 8 0 0 0 16 0" fill="none" stroke="#10324a" stroke-width="3"/>
    </g>
  </defs>
  <g transform="translate(0 228)">
    <use href="#camisa" x="96"/><use href="#camisa" x="186"/><use href="#camisa" x="276"/><use href="#camisa" x="366"/><use href="#camisa" x="456"/>
  </g>
  <!-- lupa do scout sobre a primeira -->
  <g transform="translate(96 210)" fill="none" stroke="#fff" stroke-linecap="round">
    <circle r="50" stroke-width="6" stroke-opacity=".9"/><path d="M36 36l28 28" stroke-width="12"/>
  </g>
  <text x="44" y="96" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="72" fill="#fff">5+</text>
  <text x="48" y="122" font-family="Arial, sans-serif" font-weight="700" font-size="14" letter-spacing="3" fill="#74acdf">ARGENTINOS NO ELENCO</text>
</svg>
