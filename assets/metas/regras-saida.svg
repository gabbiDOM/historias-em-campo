<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- Regra de saída: proposta de clube campeão europeu não pode ser recusada; de quem nunca ganhou, pode -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141c33"/><stop offset="1" stop-color="#070a14"/></linearGradient>
    <linearGradient id="prata" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#c9d1dc"/><stop offset="1" stop-color="#7d8796"/></linearGradient>
    <g id="orelhuda">
      <path d="M-34-70h68v34a34 34 0 0 1-68 0z"/>
      <path d="M-34-62c-34-4-46 14-40 30 6 14 22 18 40 14v-10c-12 2-24-1-28-9-4-10 6-18 28-15zM34-62c34-4 46 14 40 30-6 14-22 18-40 14v-10c12 2 24-1 28-9 4-10-6-18-28-15z"/>
      <rect x="-8" y="-4" width="16" height="30" rx="4"/><rect x="-26" y="24" width="52" height="12" rx="4"/><rect x="-36" y="36" width="72" height="16" rx="5"/>
    </g>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <!-- anel de estrelas -->
  <g fill="#fff" opacity=".1">
    <circle cx="320" cy="40" r="5"/><circle cx="410" cy="64" r="5"/><circle cx="230" cy="64" r="5"/><circle cx="470" cy="130" r="5"/><circle cx="170" cy="130" r="5"/>
  </g>
  <path d="M320 70v230" stroke="#fff" stroke-opacity=".15" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- esquerda: campeão europeu -> venda liberada -->
  <use href="#orelhuda" x="170" y="190" fill="url(#prata)"/>
  <g transform="translate(170 290)">
    <circle r="22" fill="#8ee53f"/><path d="M-10 0l7 8 13-15" fill="none" stroke="#0b1d12" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- direita: nunca venceu -> podemos recusar -->
  <use href="#orelhuda" x="470" y="190" fill="none" stroke="#9aa4b2" stroke-width="3" stroke-dasharray="6 5"/>
  <g transform="translate(470 286)">
    <path d="M-16 0v-12a16 16 0 0 1 32 0v12" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <rect x="-24" y="-2" width="48" height="34" rx="7" fill="#e5333a"/>
  </g>
  <g font-family="Arial, sans-serif" font-weight="700" font-size="13" letter-spacing="2" text-anchor="middle">
    <text x="170" y="64" fill="#8ee53f">JÁ GANHOU</text><text x="170" y="82" fill="#fff" opacity=".7">SAÍDA LIBERADA</text>
    <text x="470" y="64" fill="#ff6b72">NUNCA GANHOU</text><text x="470" y="82" fill="#fff" opacity=".7">PODEMOS RECUSAR</text>
  </g>
</svg>
