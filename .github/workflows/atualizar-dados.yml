name: Atualizar dados (Drive e YouTube)

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  dados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar planilha do Google Drive
        run: python3 .github/scripts/planilha.py

      - name: Buscar vídeos da série no YouTube
        run: python3 .github/scripts/youtube.py

      - name: Buscar escudos, estádios e fotos
        run: |
          pip install --quiet openpyxl
          python3 .github/scripts/enriquecer.py

      - name: Salvar e republicar se mudou
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain dados)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dados
            git commit -m "Atualiza dados da planilha e do YouTube"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          else
            echo "Nada novo."
          fi
