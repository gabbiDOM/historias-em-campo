name: Atualizar vídeos do YouTube

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar vídeos da série
        run: python3 .github/scripts/youtube.py

      - name: Salvar e republicar se mudou
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain dados/videos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dados/videos.json
            git commit -m "Atualiza vídeos do YouTube"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          else
            echo "Nenhum vídeo novo."
          fi
